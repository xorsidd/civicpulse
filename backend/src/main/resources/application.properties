spring.application.name=civicpulse-backend
server.port=8080

# Database Configuration
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/civicpulse?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Multipart / File Storage Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
civicpulse.file.upload-dir=${FILE_STORAGE_PATH:uploads}

# Security / JWT Configuration
civicpulse.jwt.secret=${JWT_SECRET:CivicPulseSuperSecretKeyForJWTTokenGeneration2026SecureKeyWithAtLeast256Bits}
civicpulse.jwt.expiration=86400000

# Duplicate Detection Configuration
civicpulse.duplicate.radius-meters=50.0
civicpulse.duplicate.threshold=80.0

# AI Configuration
civicpulse.ai.api-key=${AI_API_KEY:demo_key}

# OpenAPI / Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
